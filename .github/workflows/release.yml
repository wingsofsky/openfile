name: Release

# 打 tag 触发：git tag v0.1.0 && git push --tags
# 产出（草稿 release）：Windows -setup.exe（只出 NSIS，见 src-tauri/tauri.windows.conf.json），macOS .dmg（Apple Silicon + Intel），
# 每个安装包一份构建来源证明（actions/attest，仓库公开时才出），随包 git 的对应源码包（GPL-2.0），以上文件的 SHA256SUMS。
# 安装包自带官方 Node 与 dugite-native 的 git：scripts/fetch-sidecars.mjs 下载并校验，tauri.bundle.conf.json 合进去。
# 未配置代码签名：Windows 首次运行有 SmartScreen 提示（更多信息 → 仍要运行）；macOS 15 起要到
# 系统设置 → 隐私与安全性 里放行。要去掉提示得配签名与 Apple 公证（见 https://tauri.app/distribute/）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            installers: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            installers: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
            installers: src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # pnpm 版本取 package.json 的 packageManager；这里再写 version 会与它冲突报错
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Fetch bundled Node and git
        run: node scripts/fetch-sidecars.mjs --target ${{ matrix.target }}
      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Openfile ${{ github.ref_name }}"
          releaseBody: |
            These installers are not code-signed.
            - Windows: if SmartScreen stops the installer, choose More info → Run anyway.
            - macOS 15 and later: after the first blocked launch, open System Settings → Privacy & Security and choose Open Anyway.

            Verify a download: compare it with SHA256SUMS${{ !github.event.repository.private && format(', or run `gh attestation verify <file> --repo {0}`', github.repository) || '' }}.

            The bundled Git is GPL-2.0; its source code is attached as `*-source.tar.gz`. The Windows package also contains MSYS2 tools from Git for Windows, with sources at https://github.com/git-for-windows/MSYS2-packages.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} --config src-tauri/tauri.bundle.conf.json
      # GitHub 免费版 / Pro / Team 只给公开仓出构建来源证明（私有仓要 Enterprise Cloud）；
      # 仓库私有时跳过这一步，否则 build 失败、后面的 SHA256SUMS 也不出
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@v4
        with:
          subject-path: ${{ matrix.installers }}

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Git source and SHA256SUMS to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir assets
          # 随包 git 是 GPL-2.0：对应源码随每个 release 附上，文件名与地址出自 fetch-sidecars.mjs 钉住的版本
          node scripts/fetch-sidecars.mjs --source-urls | while read -r name url; do
            curl -fsSL --retry 3 -o "assets/$name" "$url"
          done
          cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.exe' --pattern '*.dmg'
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" *-source.tar.gz SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
