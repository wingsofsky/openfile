[package]
name = "openfile"
version = "0.1.0"
description = "Openfile — a multi-format reader for reviewing with your agents"
authors = ["wingsofsky"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "openfile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
encoding_rs = "0.8"
chardetng = "1"
trash = "5"
drag = "2"
clipboard-rs = { version = "0.3", default-features = false }
# 第二次启动把参数转给已开的实例（打开方式 / 目录右键 / openfile open）
tauri-plugin-single-instance = "2"
# Windows：canonicalize 的 `\\?\` 前缀在离开 Rust 前还原成普通路径（已在 Cargo.lock 里，tauri 自带依赖）
dunce = "1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSNotification", "NSOperation", "NSString", "block2"] }

[dev-dependencies]
tempfile = "3"
# 测试里查进程还在不在（杀进程树）
sysinfo = "0.38.4"
