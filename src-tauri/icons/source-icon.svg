  <rect x="106" y="106" width="812" height="812" rx="179" fill="none" stroke="#e8e4d8" stroke-width="10"/>
  <!-- open book silhouette, ink -->
  <path fill="#111111" d="
    M 512 402
    C 452 362, 352 350, 272 366
    L 272 646
    C 352 630, 452 642, 512 684
    C 572 642, 672 630, 752 646
