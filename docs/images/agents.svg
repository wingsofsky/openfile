<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-label="Two ways to change a document with an agent: chat with Claude Code, Codex, Gemini CLI or Grok in Openfile's side panel, where each turn's changes are marked to keep or roll back; or let your desktop agent open Openfile in its own browser pane and edit while you watch. Both write plain text to the same files, and Openfile keeps snapshots outside your .git">
  <style>
    .panel { fill: #f6f8fa; stroke: #d1d9e0; } .chip { fill: #ffffff; stroke: #d1d9e0; }
    .ink { fill: #1f2328; } .muted { fill: #59636e; } .accent { fill: #bc4c00; }
    .line { stroke: #59636e; fill: none; } .arrowhead { fill: #59636e; }
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #161b22; stroke: #3d444d; } .chip { fill: #0d1117; stroke: #3d444d; }
      .ink { fill: #e6edf3; } .muted { fill: #9198a1; } .accent { fill: #f0883e; }
      .line { stroke: #9198a1; } .arrowhead { fill: #9198a1; }
    }
  </style>

  <!-- A: in-app chat -->
  <rect class="panel" x="1" y="1" width="280" height="250" rx="10"/>
  <text class="accent sans" x="20" y="30" font-size="12.5">A</text>
  <text class="ink sans" x="36" y="30" font-size="15" font-weight="600">Chat in the side panel</text>
  <g class="sans">
    <rect class="chip" x="20" y="48" width="242" height="34" rx="6"/>
    <text class="ink mono" x="34" y="70" font-size="13">Claude Code · Codex</text>
    <rect class="chip" x="20" y="90" width="242" height="34" rx="6"/>
    <text class="ink mono" x="34" y="112" font-size="13">Gemini CLI · Grok · …</text>
    <text class="muted" x="20" y="152" font-size="12.5">runs on your own sign-in, sees the</text>
    <text class="muted" x="20" y="169" font-size="12.5">file you have open</text>
    <text class="muted" x="20" y="198" font-size="12.5">each turn is snapshotted first, then</text>
    <text class="muted" x="20" y="215" font-size="12.5">its changes are marked: keep or roll</text>
    <text class="muted" x="20" y="232" font-size="12.5">back each block, or the whole turn</text>
  </g>

  <!-- B: desktop agent -->
  <rect class="panel" x="599" y="1" width="280" height="250" rx="10"/>
  <text class="accent sans" x="618" y="30" font-size="12.5">B</text>
  <text class="ink sans" x="634" y="30" font-size="15" font-weight="600">Your desktop agent</text>
  <g class="sans">
    <rect class="chip" x="618" y="48" width="242" height="34" rx="6"/>
    <text class="ink" x="632" y="70" font-size="13">Claude Code desktop, …</text>
    <rect class="chip" x="618" y="90" width="242" height="34" rx="6"/>
    <text class="ink mono" x="632" y="112" font-size="13">pnpm dev → browser pane</text>
    <text class="muted" x="618" y="152" font-size="12.5">opens Openfile on your folder in its</text>
    <text class="muted" x="618" y="169" font-size="12.5">own browser pane</text>
    <text class="muted" x="618" y="198" font-size="12.5">edits the files or leaves suggestions;</text>
    <text class="muted" x="618" y="215" font-size="12.5">you watch them land in the same view</text>
    <text class="muted" x="618" y="232" font-size="12.5">and accept or reject them there</text>
  </g>

  <!-- center: Openfile -->
  <rect class="panel" x="320" y="46" width="240" height="160" rx="10"/>
  <text class="ink sans" x="440" y="80" font-size="16" font-weight="600" text-anchor="middle">Openfile</text>
  <text class="muted sans" x="440" y="104" font-size="12.5" text-anchor="middle">read · review · edit</text>
  <g class="mono" font-size="12.5">
    <text class="accent" x="440" y="140" text-anchor="middle">{++ ++}  {-- --}  {&gt;&gt; &lt;&lt;}</text>
  </g>
  <text class="muted sans" x="440" y="172" font-size="12.5" text-anchor="middle">you accept or reject,</text>
  <text class="muted sans" x="440" y="189" font-size="12.5" text-anchor="middle">one mark at a time</text>

  <path class="line" d="M 282 126 L 312 126" stroke-width="1.5"/>
  <path class="arrowhead" d="M 320 126 L 310 120 L 310 132 Z"/>
  <path class="line" d="M 598 126 L 568 126" stroke-width="1.5"/>
  <path class="arrowhead" d="M 560 126 L 570 120 L 570 132 Z"/>

  <!-- down to files -->
  <path class="line" d="M 440 207 L 440 286" stroke-width="1.5"/>
  <path class="arrowhead" d="M 440 294 L 434 284 L 446 284 Z"/>

  <!-- bottom: files + snapshots -->
  <rect class="chip" x="160" y="300" width="270" height="72" rx="8"/>
  <text class="ink sans" x="178" y="327" font-size="14" font-weight="600">Your folder</text>
  <text class="muted sans" x="178" y="348" font-size="12.5">plain text files, your own .git untouched</text>
  <rect class="chip" x="450" y="300" width="270" height="72" rx="8"/>
  <text class="ink sans" x="468" y="327" font-size="14" font-weight="600">Snapshots</text>
  <text class="muted sans" x="468" y="348" font-size="12.5">a hidden repository in the app's data</text>
  <text class="muted sans" x="468" y="364" font-size="12.5">folder, for the version timeline</text>

  <text class="accent sans" x="440" y="412" font-size="13" text-anchor="middle">Both ways write the same plain text, so you review agent changes in one place.</text>
</svg>
