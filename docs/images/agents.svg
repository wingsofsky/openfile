<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" width="880" height="640" role="img" aria-label="Three ways to change a document with an agent: chat with Claude Code, Codex, Gemini CLI or Grok in Openfile's side panel, where each turn's changes are marked to keep or roll back; copy a one-line prompt with the file's exact path and paste it into your agent's chat, such as the Claude Code or Codex desktop app; or let your desktop agent open Openfile in its own browser pane and edit while you watch. All three write plain text to the same files, and Openfile keeps snapshots outside your .git">
  <style>
    .panel { fill: #f6f8fa; stroke: #d1d9e0; } .chip { fill: #ffffff; stroke: #d1d9e0; }
    .ink { fill: #1f2328; } .muted { fill: #59636e; } .accent { fill: #bc4c00; }
    .line { stroke: #59636e; fill: none; } .arrowhead { fill: #59636e; }
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #161b22; stroke: #3d444d; } .chip { fill: #0d1117; stroke: #3d444d; }
      .ink { fill: #e6edf3; } .muted { fill: #9198a1; } .accent { fill: #f0883e; }
      .line { stroke: #9198a1; } .arrowhead { fill: #9198a1; }
    }
  </style>

  <!-- A: in-app chat -->
  <rect class="panel" x="1" y="1" width="280" height="250" rx="10"/>
  <text class="accent sans" x="20" y="30" font-size="12.5">A</text>
  <text class="ink sans" x="36" y="30" font-size="15" font-weight="600">Chat in the side panel</text>
  <g class="sans">
    <rect class="chip" x="20" y="48" width="242" height="34" rx="6"/>
    <text class="ink mono" x="34" y="70" font-size="13">Claude Code · Codex</text>
    <rect class="chip" x="20" y="90" width="242" height="34" rx="6"/>
    <text class="ink mono" x="34" y="112" font-size="13">Gemini CLI · Grok · …</text>
    <text class="muted" x="20" y="152" font-size="12.5">runs on your own sign-in, sees the</text>
    <text class="muted" x="20" y="169" font-size="12.5">file you have open</text>
    <text class="muted" x="20" y="198" font-size="12.5">each turn is snapshotted first, then</text>
    <text class="muted" x="20" y="215" font-size="12.5">its changes are marked: keep or roll</text>
    <text class="muted" x="20" y="232" font-size="12.5">back each block, or the whole turn</text>
  </g>

  <!-- B: copy a prompt into your agent's chat -->
  <rect class="panel" x="300" y="1" width="280" height="250" rx="10"/>
  <text class="accent sans" x="319" y="30" font-size="12.5">B</text>
  <text class="ink sans" x="335" y="30" font-size="15" font-weight="600">Copy a prompt to your agent</text>
  <g class="sans">
    <rect class="chip" x="319" y="48" width="242" height="34" rx="6"/>
    <text class="ink mono" x="333" y="70" font-size="13">Read my comments in …</text>
    <rect class="chip" x="319" y="90" width="242" height="34" rx="6"/>
    <text class="ink" x="333" y="112" font-size="13">Claude Code, Codex desktop, …</text>
    <text class="muted" x="319" y="152" font-size="12.5">one line with the file's exact path,</text>
    <text class="muted" x="319" y="169" font-size="12.5">in the interface language</text>
    <text class="muted" x="319" y="198" font-size="12.5">paste it into your agent's chat: it</text>
    <text class="muted" x="319" y="215" font-size="12.5">applies your edits and answers your</text>
    <text class="muted" x="319" y="232" font-size="12.5">comments; Openfile reloads the file</text>
  </g>

  <!-- C: Openfile in the agent's browser pane -->
  <rect class="panel" x="599" y="1" width="280" height="250" rx="10"/>
  <text class="accent sans" x="618" y="30" font-size="12.5">C</text>
  <text class="ink sans" x="634" y="30" font-size="15" font-weight="600">In your agent's browser pane</text>
  <g class="sans">
    <rect class="chip" x="618" y="48" width="242" height="34" rx="6"/>
    <text class="ink" x="632" y="70" font-size="13">Claude Code desktop, …</text>
    <rect class="chip" x="618" y="90" width="242" height="34" rx="6"/>
    <text class="ink mono" x="632" y="112" font-size="13">pnpm dev → browser pane</text>
    <text class="muted" x="618" y="152" font-size="12.5">opens Openfile on your folder in its</text>
    <text class="muted" x="618" y="169" font-size="12.5">own browser pane</text>
    <text class="muted" x="618" y="198" font-size="12.5">edits the files or leaves suggestions;</text>
    <text class="muted" x="618" y="215" font-size="12.5">you watch them land in the same view</text>
    <text class="muted" x="618" y="232" font-size="12.5">and accept or reject them there</text>
  </g>

  <!-- arrows into Openfile -->
  <path class="line" d="M 141 252 L 141 365 L 312 365" stroke-width="1.5"/>
  <path class="arrowhead" d="M 320 365 L 310 359 L 310 371 Z"/>
  <path class="line" d="M 440 252 L 440 282" stroke-width="1.5"/>
  <path class="arrowhead" d="M 440 290 L 434 280 L 446 280 Z"/>
  <path class="line" d="M 739 252 L 739 365 L 568 365" stroke-width="1.5"/>
  <path class="arrowhead" d="M 560 365 L 570 359 L 570 371 Z"/>

  <!-- center: Openfile -->
  <rect class="panel" x="320" y="290" width="240" height="150" rx="10"/>
  <text class="ink sans" x="440" y="322" font-size="16" font-weight="600" text-anchor="middle">Openfile</text>
  <text class="muted sans" x="440" y="346" font-size="12.5" text-anchor="middle">read · review · edit</text>
  <g class="mono" font-size="12.5">
    <text class="accent" x="440" y="380" text-anchor="middle">{++ ++}  {-- --}  {&gt;&gt; &lt;&lt;}</text>
  </g>
  <text class="muted sans" x="440" y="410" font-size="12.5" text-anchor="middle">you accept or reject,</text>
  <text class="muted sans" x="440" y="427" font-size="12.5" text-anchor="middle">one mark at a time</text>

  <!-- down to files -->
  <path class="line" d="M 440 441 L 440 502" stroke-width="1.5"/>
  <path class="arrowhead" d="M 440 510 L 434 500 L 446 500 Z"/>

  <!-- bottom: files + snapshots -->
  <rect class="chip" x="160" y="516" width="270" height="72" rx="8"/>
  <text class="ink sans" x="178" y="543" font-size="14" font-weight="600">Your folder</text>
  <text class="muted sans" x="178" y="564" font-size="12.5">plain text files, your own .git untouched</text>
  <rect class="chip" x="450" y="516" width="270" height="72" rx="8"/>
  <text class="ink sans" x="468" y="543" font-size="14" font-weight="600">Snapshots</text>
  <text class="muted sans" x="468" y="564" font-size="12.5">a hidden repository in the app's data</text>
  <text class="muted sans" x="468" y="580" font-size="12.5">folder, for the version timeline</text>

  <text class="accent sans" x="440" y="624" font-size="13" text-anchor="middle">All three write the same plain text, so you review agent changes in one place.</text>
</svg>
